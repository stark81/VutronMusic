name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions: write-all

jobs:
  Release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS（macos-14 已于 2026-11-02 退役；arm64 免费镜像是 macos-15 / macos-26）
          - os: macos-15-intel
            arch: x64
            platform: darwin
          - os: macos-26
            arch: arm64
            platform: darwin

          # Windows
          - os: windows-2022
            arch: x64
            platform: win32
          - os: windows-11-arm
            arch: arm64
            platform: win32

          # Linux
          - os: ubuntu-22.04
            arch: x64
            platform: linux
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      # 校验 runner 架构与矩阵一致，避免在 arm64 runner 上产出 x64 包（或反之）
      - name: Validate architecture match
        shell: bash
        run: |
          runner_arch=$(node -p "process.arch")
          echo "Runner OS: ${{ matrix.os }} / node arch: $runner_arch / target arch: ${{ matrix.arch }}"
          if [ "$runner_arch" != "${{ matrix.arch }}" ]; then
            echo "::error::runner 架构 ($runner_arch) 与目标架构 (${{ matrix.arch }}) 不一致"
            exit 1
          fi

      - name: Install build essentials (Linux x64)
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot snapd flatpak flatpak-builder
          sudo snap install snapcraft --classic
          sudo apt-get install -y libnss3-dev libgtk-3-dev libxss-dev libasound2
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Install system fpm for ARM64
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm
          sudo apt-get install -y rpm fakeroot
          sudo apt-get install -y libnss3 libgtk-3-0 libxss1 libasound2
          rm -rf ~/.cache/electron-builder/fpm || true
          fpm --version

      # --ignore-scripts：CI 里一个安装脚本都不需要跑（原生依赖全是预编译产物，
      # taglib-wasm 补丁与 macOS 原生插件由后面的步骤单独执行），但必须跳过，因为
      # better-sqlite3 带 binding.gyp 却没有 install 脚本，npm/yarn 会隐式执行
      # `node-gyp rebuild`；而 windows-11-arm 镜像只装了 Visual Studio 2026，
      # node-gyp 11 只认 VS 2019/2022，一旦 configure 就报
      # "Could not find any Visual Studio installation to use"。
      # SKIP_REBUILD 作为二道保险，防止以后有人去掉 --ignore-scripts。
      - name: Install deps
        env:
          SKIP_REBUILD: 'true'
        run: yarn install --ignore-scripts

      - name: Fix taglib-wasm
        run: npm run fix-taglib

      # macOS 的 tray / touchbar 原生插件必须本机编译（安装阶段跳过了所有脚本）
      - name: Build native addons (macOS)
        if: matrix.platform == 'darwin'
        run: npm run build:native

      - name: Fix app-builder permissions (Linux ARM64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          chmod +x node_modules/app-builder-bin/linux/arm64/app-builder || true

      - name: Build Electron app (Linux ARM64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          ARCH: ${{ matrix.arch }}
          USE_SYSTEM_FPM: 'true'
        run: |
          yarn build --${{ matrix.arch }} -p never --linux deb --linux rpm --linux AppImage

      - name: Build Electron app (Linux x64)
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          ARCH: ${{ matrix.arch }}
        run: |
          yarn build --${{ matrix.arch }} -p never --linux deb --linux rpm --linux AppImage --linux snap --linux flatpak

      - name: Build Electron app (其他平台)
        if: matrix.platform != 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          ARCH: ${{ matrix.arch }}
          # Windows/macOS 的更新元数据文件名不带架构后缀，x64 与 arm64 会互相覆盖，
          # 导致 x64 客户端下载到 arm64 安装包（issue #374）。arm64 改用独立通道，
          # 产物为 latest-arm64.yml / latest-arm64-mac.yml（客户端见 src/main/utils/updateChannel.ts）。
          UPDATE_CHANNEL: ${{ matrix.arch == 'arm64' && 'latest-arm64' || '' }}
        run: yarn build --${{ matrix.arch }} -p never

      # Windows artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-installer
          path: release/*/VutronMusic*_${{ matrix.arch }}.exe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-portable
          path: release/*/VutronMusic*_${{ matrix.arch }}-Portable.exe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-blockmap
          path: release/*/VutronMusic*.blockmap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-latest
          path: release/*/latest*.yml
          if-no-files-found: ignore

      # macOS artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin'
        with:
          name: VutronMusic-mac-${{ matrix.arch }}-dmg
          path: release/*/VutronMusic*_${{ matrix.arch }}.dmg
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin'
        with:
          name: VutronMusic-mac-${{ matrix.arch }}-blockmap
          path: release/*/VutronMusic*.blockmap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin'
        with:
          name: VutronMusic-mac-${{ matrix.arch }}-latest
          path: release/*/latest*.yml
          if-no-files-found: ignore

      # Linux artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-snap
          path: release/*/VutronMusic*.snap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-AppImage
          path: release/*/VutronMusic*.AppImage
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-deb
          path: release/*/VutronMusic*.deb
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-rpm
          path: release/*/VutronMusic*.rpm
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-blockmap
          path: release/*/VutronMusic*.blockmap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-latest
          path: release/*/latest*.yml
          if-no-files-found: ignore

      # Flatpak artifact (only x64)
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-flatpak
          path: release/*/VutronMusic*.flatpak
          if-no-files-found: ignore

  publish-release:
    needs: [Release]
    runs-on: ubuntu-22.04
    name: Upload to GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Display structure of downloaded files
        run: ls -R all-artifacts

      - name: Flatten all artifacts into upload folder
        shell: bash
        run: |
          mkdir -p upload
          status=0
          while IFS= read -r f; do
            base=$(basename "$f")
            dest="upload/$base"
            if [[ -e "$dest" ]]; then
              # 同名文件只允许内容完全一致（重复下载的同一产物）。
              # 内容不同说明打包配置冲突——例如 x64 与 arm64 共用 latest.yml（issue #374），
              # 以前这里按文件大小挑一个，结果挑中 arm64 的元数据，x64 用户于是被推了 arm64 包。
              if cmp -s "$f" "$dest"; then
                continue
              fi
              echo "::error::产物出现同名但内容不同的文件: $base"
              status=1
            else
              cp "$f" "$dest"
            fi
          done < <(find all-artifacts -type f)
          exit $status

      - name: Verify update metadata per architecture
        shell: bash
        run: |
          # 每个平台/架构都必须有各自的更新元数据：缺一个就意味着该平台自动更新失效
          expected=(
            latest.yml              # Windows x64
            latest-arm64.yml        # Windows arm64（独立通道）
            latest-mac.yml          # macOS x64
            latest-arm64-mac.yml    # macOS arm64（独立通道）
            latest-linux.yml        # Linux x64
            latest-linux-arm64.yml  # Linux arm64（electron-updater 自动加架构后缀）
          )
          failed=0
          for f in "${expected[@]}"; do
            if [[ ! -f "upload/$f" ]]; then
              echo "::error::缺少更新元数据 $f"
              failed=1
            fi
          done

          # 回归断言：x64 通道不能指向 arm64 安装包（issue #374 的根因）
          if grep -qi 'arm64' upload/latest.yml; then
            echo "::error::latest.yml 指向了 arm64 安装包，x64 用户会下载到错误架构"
            failed=1
          fi
          if ! grep -q '_x64\.exe' upload/latest.yml; then
            echo "::error::latest.yml 未指向 x64 安装包"
            failed=1
          fi
          if ! grep -q '_arm64\.exe' upload/latest-arm64.yml; then
            echo "::error::latest-arm64.yml 未指向 arm64 安装包"
            failed=1
          fi
          exit $failed

      - name: Create release tag if triggered by workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          DATE_TAG=$(date +'%Y%m%d%H%M')
          echo "RELEASE_TAG=v-draft-${DATE_TAG}" >> $GITHUB_ENV

      - name: Set tag from git tag if available
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Upload all files to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          files: upload/*
          draft: true
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
