name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions: write-all

jobs:
  Release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS（macos-14 已于 2026-11-02 退役；arm64 免费镜像是 macos-15 / macos-26）
          - os: macos-15-intel
            arch: x64
            platform: darwin
          - os: macos-26
            arch: arm64
            platform: darwin

          # Windows
          - os: windows-2022
            arch: x64
            platform: win32
          - os: windows-11-arm
            arch: arm64
            platform: win32

          # Linux
          - os: ubuntu-22.04
            arch: x64
            platform: linux
          - os: ubuntu-22.04-arm
            arch: arm64
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      # 校验 runner 架构与矩阵一致，避免在 arm64 runner 上产出 x64 包（或反之）
      - name: Validate architecture match
        shell: bash
        run: |
          runner_arch=$(node -p "process.arch")
          echo "Runner OS: ${{ matrix.os }} / node arch: $runner_arch / target arch: ${{ matrix.arch }}"
          if [ "$runner_arch" != "${{ matrix.arch }}" ]; then
            echo "::error::runner 架构 ($runner_arch) 与目标架构 (${{ matrix.arch }}) 不一致"
            exit 1
          fi

      - name: Install build essentials (Linux x64)
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot snapd flatpak flatpak-builder
          sudo snap install snapcraft --classic
          sudo apt-get install -y libnss3-dev libgtk-3-dev libxss-dev libasound2
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Install system fpm for ARM64
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm
          sudo apt-get install -y rpm fakeroot
          sudo apt-get install -y libnss3 libgtk-3-0 libxss1 libasound2
          rm -rf ~/.cache/electron-builder/fpm || true
          fpm --version

      # SKIP_REBUILD 跳过 sandbox 设置与原生插件编译：打包用到的原生模块都是预编译产物
      # （见 rebuild.js 注释），因此安装依赖阶段不需要图形环境，也不会触发 node-gyp。
      - name: Install deps
        env:
          SKIP_REBUILD: 'true'
        run: yarn

      - name: Fix taglib-wasm
        run: npm run fix-taglib

      # macOS 的 tray / touchbar 原生插件必须本机编译（postinstall 里这一步在 CI 被跳过了）
      - name: Build native addons (macOS)
        if: matrix.platform == 'darwin'
        run: npm run build:native

      - name: Fix app-builder permissions (Linux ARM64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          chmod +x node_modules/app-builder-bin/linux/arm64/app-builder || true

      - name: Build Electron app (Linux ARM64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          ARCH: ${{ matrix.arch }}
          USE_SYSTEM_FPM: 'true'
        run: |
          yarn build --${{ matrix.arch }} -p never --linux deb --linux rpm --linux AppImage

      - name: Build Electron app (Linux x64)
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          ARCH: ${{ matrix.arch }}
        run: |
          yarn build --${{ matrix.arch }} -p never --linux deb --linux rpm --linux AppImage --linux snap --linux flatpak

      - name: Build Electron app (其他平台)
        if: matrix.platform != 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          ARCH: ${{ matrix.arch }}
        run: yarn build --${{ matrix.arch }} -p never

      # Windows artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-installer
          path: release/*/VutronMusic*_${{ matrix.arch }}.exe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-portable
          path: release/*/VutronMusic*_${{ matrix.arch }}-Portable.exe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-blockmap
          path: release/*/VutronMusic*.blockmap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'win32'
        with:
          name: VutronMusic-win-${{ matrix.arch }}-latest
          path: release/*/latest*.yml
          if-no-files-found: ignore

      # macOS artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin'
        with:
          name: VutronMusic-mac-${{ matrix.arch }}-dmg
          path: release/*/VutronMusic*_${{ matrix.arch }}.dmg
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin'
        with:
          name: VutronMusic-mac-${{ matrix.arch }}-blockmap
          path: release/*/VutronMusic*.blockmap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'darwin'
        with:
          name: VutronMusic-mac-${{ matrix.arch }}-latest
          path: release/*/latest*.yml
          if-no-files-found: ignore

      # Linux artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-snap
          path: release/*/VutronMusic*.snap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-AppImage
          path: release/*/VutronMusic*.AppImage
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-deb
          path: release/*/VutronMusic*.deb
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-rpm
          path: release/*/VutronMusic*.rpm
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-blockmap
          path: release/*/VutronMusic*.blockmap
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-latest
          path: release/*/latest*.yml
          if-no-files-found: ignore

      # Flatpak artifact (only x64)
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        with:
          name: VutronMusic-linux-${{ matrix.arch }}-flatpak
          path: release/*/VutronMusic*.flatpak
          if-no-files-found: ignore

  publish-release:
    needs: [Release]
    runs-on: ubuntu-22.04
    name: Upload to GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Display structure of downloaded files
        run: ls -R all-artifacts

      - name: Flatten all artifacts into upload folder (keep larger latest.yml if duplicate)
        run: |
          mkdir -p upload
          for f in $(find all-artifacts -type f); do
            base=$(basename "$f")
            dest="upload/$base"
            if [[ "$base" == latest*.yml ]]; then
              # 如果已经存在同名文件，就比大小
              if [[ -f "$dest" ]]; then
                old_size=$(stat -c%s "$dest")
                new_size=$(stat -c%s "$f")
                if (( new_size > old_size )); then
                  echo "⚡ Replacing $base with bigger file ($new_size > $old_size)"
                  cp "$f" "$dest"
                else
                  echo "⚡ Keeping existing $base ($old_size >= $new_size)"
                fi
              else
                cp "$f" "$dest"
              fi
            else
              cp "$f" "$dest"
            fi
          done

      - name: Create release tag if triggered by workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          DATE_TAG=$(date +'%Y%m%d%H%M')
          echo "RELEASE_TAG=v-draft-${DATE_TAG}" >> $GITHUB_ENV

      - name: Set tag from git tag if available
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Upload all files to GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          files: upload/*
          draft: true
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
